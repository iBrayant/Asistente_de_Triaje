<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente de Triaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F4FAF8; --surface: #FFFFFF; --ink: #1F3D3A; --muted: #5A7773;
    --line: #D9EBE7; --field: #B5D6CF;
    --accent: #A8DCD1; --on-accent: #16403B;
    --soft: #E3F4F0; --soft-ink: #1F5C54; --note: #EEF6F4; --note-ink: #3F5F5B;
    --baja-bg: #DDF1E3; --baja-ink: #1F5B34;
    --media-bg: #FBEBC8; --media-ink: #6A4A0B;
    --alta-bg: #F8D4D4; --alta-ink: #7A2B2B;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Figtree', system-ui, sans-serif; background: var(--bg); color: var(--ink);
         min-height: 100vh; display: flex; flex-direction: column; }
  button, textarea { font-family: inherit; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
           padding: 16px 32px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .marca { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; }
  .marca h1 { margin: 0; font-size: 20px; line-height: 1.2; }
  .marca small { color: var(--muted); font-size: 14px; }
  .acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .local { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
           background: var(--soft); color: var(--soft-ink); font-size: 14px; font-weight: 600; }
  .secundario { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--field);
                background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; }
  main { flex: 1; width: 100%; max-width: 820px; margin: 0 auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; }
  .aviso { padding: 14px 16px; border-radius: 12px; background: var(--note); color: var(--note-ink); font-size: 15px; line-height: 1.5; }
  #chat { display: flex; flex-direction: column; gap: 16px; }
  .fila-agente { display: flex; gap: 12px; align-items: flex-start; }
  .avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; }
  .burbuja { padding: 14px 18px; font-size: 17px; line-height: 1.5; max-width: 85%; overflow-wrap: anywhere; }
  .usuario { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-radius: 18px 18px 4px 18px; }
  .agente { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 18px 18px 18px; }
  .etiqueta { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .error { background: var(--alta-bg); color: var(--alta-ink); border-radius: 12px; padding: 14px 18px; }
  .resultado { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .banda { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; font-weight: 700; }
  .banda.baja { background: var(--baja-bg); color: var(--baja-ink); }
  .banda.media { background: var(--media-bg); color: var(--media-ink); }
  .banda.alta { background: var(--alta-bg); color: var(--alta-ink); }
  .medidor { display: flex; gap: 6px; }
  .medidor span { width: 28px; height: 8px; border-radius: 4px; background: currentColor; opacity: .25; }
  .medidor span.on { opacity: 1; }
  .cuerpo { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .especialidad { font-size: 32px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
  .cuerpo p { margin: 4px 0 0; font-size: 17px; line-height: 1.6; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { padding: 6px 14px; border-radius: 999px; background: var(--soft); color: var(--soft-ink); font-size: 15px; font-weight: 600; }
  .pie { padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); }
  .puntos span { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; background: var(--muted); animation: salto 1s infinite; }
  .puntos span:nth-child(2) { animation-delay: .15s; } .puntos span:nth-child(3) { animation-delay: .3s; }
  @keyframes salto { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .puntos span { animation: none; } }
  .barra { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); }
  form { max-width: 820px; margin: 0 auto; padding: 16px 20px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .campo { flex: 1 1 320px; min-width: 0; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  textarea { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--field); background: var(--surface);
             color: var(--ink); font-size: 16px; line-height: 1.5; resize: vertical; }
  textarea:focus-visible, button:focus-visible { outline: 3px solid var(--on-accent); outline-offset: 2px; }
  #enviar { min-height: 52px; padding: 0 28px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent);
            font-size: 17px; font-weight: 700; cursor: pointer; }
  #enviar:disabled { opacity: .6; cursor: wait; }
  @media (max-width: 600px) { header { padding: 12px 16px; } .burbuja { max-width: 92%; } .especialidad { font-size: 26px; } .banda, .cuerpo { padding-inline: 16px; } }
</style>
</head>
<body>
<header>
  <div class="marca">
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16403B" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div><h1>Asistente de Triaje</h1><small>Orientación por síntomas · Universidad de Cundinamarca</small></div>
  </div>
  <div class="acciones">
    <div class="local">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      100% local: tus datos no salen de este equipo
    </div>
    <button type="button" id="nueva" class="secundario">Nueva consulta</button>
  </div>
</header>

<main>
  <div class="aviso">Esto es una orientación, no un diagnóstico ni una receta. Si sientes que es una emergencia, llama a la línea 123 o acude a urgencias.</div>
  <section id="chat" aria-live="polite" aria-label="Conversación"></section>
</main>

<div class="barra">
  <form id="form">
    <div class="campo">
      <label for="mensaje">Cuéntame cómo te sientes</label>
      <textarea id="mensaje" rows="2" placeholder="Ej: Tengo dolor de cabeza fuerte desde ayer y me molesta la luz"></textarea>
    </div>
    <button type="submit" id="enviar">Enviar</button>
  </form>
</div>

<script>
const API = "/triaje";
const $ = id => document.getElementById(id);
const chat = $("chat"), campo = $("mensaje"), boton = $("enviar");

// Historial de la consulta: vive solo en este navegador; el servidor no guarda nada.
let historial = [];

function el(tag, clase, texto) {
  const e = document.createElement(tag);
  if (clase) e.className = clase;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

function cruz() {
  const a = el("div", "avatar");
  a.setAttribute("aria-hidden", "true");
  a.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5C54" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  return a;
}

function conAvatar(contenido) {
  const fila = el("div", "fila-agente");
  fila.append(cruz(), contenido);
  chat.append(fila);
  return fila;
}

function burbujaUsuario(texto) {
  chat.append(el("div", "burbuja usuario", texto));
}

function burbujaPregunta(d) {
  const b = el("div", "burbuja agente");
  b.append(el("div", "etiqueta", "Necesito más información"), document.createTextNode(d.pregunta));
  conAvatar(b);
}

const NIVELES = { baja: 1, media: 2, alta: 3 };
const TEXTO_URGENCIA = {
  baja: "Urgencia baja: puedes pedir una cita",
  media: "Urgencia media: consulta pronto",
  alta: "Urgencia alta: busca atención pronto",
};

function tarjetaResultado(d) {
  const nivel = NIVELES[d.nivel_urgencia] ? d.nivel_urgencia : "media";
  const card = el("article", "resultado");
  card.setAttribute("aria-label", "Resultado del triaje");

  const banda = el("div", "banda " + nivel);
  banda.append(el("span", "", TEXTO_URGENCIA[nivel]));
  const med = el("div", "medidor");
  med.setAttribute("aria-hidden", "true");
  for (let i = 1; i <= 3; i++) med.append(el("span", i <= NIVELES[nivel] ? "on" : ""));
  banda.append(med);

  const cuerpo = el("div", "cuerpo");
  const esp = el("div");
  esp.append(el("div", "etiqueta", "Especialidad sugerida"), el("div", "especialidad", d.especialidad_sugerida));
  const por = el("div");
  por.append(el("div", "etiqueta", "Por qué"), el("p", "", d.justificacion));
  cuerpo.append(esp, por);

  if (d.sintomas_reportados.length) {
    const s = el("div");
    s.append(el("div", "etiqueta", "Síntomas que entendí"));
    const chips = el("div", "chips");
    d.sintomas_reportados.forEach(t => chips.append(el("span", "chip", String(t))));
    s.append(chips);
    cuerpo.append(s);
  }
  const pie = el("div", "pie");
  pie.append(el("span", "", "No es un diagnóstico. Un profesional de la salud debe valorarte."), el("span", "", d.fecha));
  cuerpo.append(pie);

  card.append(banda, cuerpo);
  conAvatar(card);
}

function mostrarError(texto) {
  chat.append(el("div", "error", "Error: " + texto));
}

function pensando() {
  const b = el("div", "burbuja agente puntos");
  b.setAttribute("aria-label", "Analizando");
  b.innerHTML = "<span></span><span></span><span></span>";
  return conAvatar(b);
}

async function enviar(mensaje) {
  burbujaUsuario(mensaje);
  campo.value = "";
  boton.disabled = true;
  const espera = pensando();
  scrollFinal();
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensaje, historial }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "No se pudo procesar el mensaje");
    espera.remove();
    historial.push({ role: "user", content: mensaje }, { role: "assistant", content: JSON.stringify(d) });
    if (d.accion === "solicitar_informacion") burbujaPregunta(d); else tarjetaResultado(d);
  } catch (e) {
    espera.remove();
    mostrarError(e.message);
  } finally {
    boton.disabled = false;
    campo.focus();
    scrollFinal();
  }
}

function scrollFinal() { window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const m = campo.value.trim();
  if (m && !boton.disabled) enviar(m);
});
// Enter envía; Shift+Enter hace salto de línea.
campo.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("nueva").onclick = () => { historial = []; chat.replaceChildren(); campo.value = ""; campo.focus(); };
</script>
</body>
</html>
